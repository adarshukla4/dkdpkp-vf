<!doctype html>
<html lang="gu">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6A3B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>DKDPKP Field Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column, two tabs (Calculator, Saved). Big touch targets, results sit directly under their inputs. Gujarati is the default language. */
:root{
  color-scheme:light;
  --bg:#EDF1EA; --surface:#FFFFFF; --field:#F6F9F4; --ink:#13201A; --muted:#566559;
  --line:#C9D4C6; --accent:#1E6A3B; --accent-ink:#FFFFFF; --gold-bg:#FFEFC2; --good:#14733A; --bad:#B3261E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1611; --surface:#16211A; --field:#101A13; --ink:#E6EFE8; --muted:#9AAE9F;
    --line:#2B3B30; --accent:#58C687; --accent-ink:#06210F; --gold-bg:#2E2610; --good:#6EDB9A; --bad:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --field:#101A13; --ink:#E6EFE8; --muted:#9AAE9F;
  --line:#2B3B30; --accent:#58C687; --accent-ink:#06210F; --gold-bg:#2E2610; --good:#6EDB9A; --bad:#FF8A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Gujarati","Shruti","Noto Sans Devanagari",sans-serif;
  margin:0; padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
html[lang="gu"] body{line-height:1.65}
html[lang="gu"] *{letter-spacing:0!important}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
.view{display:grid;gap:16px}
h1{font-size:25px;line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.card h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
html[lang="gu"] .card h2{font-size:15px}
label,.lbl{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
input,select{
  width:100%;min-width:0;height:52px;font:inherit;font-size:20px;font-variant-numeric:tabular-nums;
  color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:10px;padding:0 12px;
}
input[type="text"]{font-size:18px}
select{font-size:17px}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{margin:0;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--field);font-size:14px}
.hero{display:grid;gap:2px}
.hero .big{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;overflow-wrap:anywhere}
.hero .unit{color:var(--muted);font-size:14px}
.stat{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--muted)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.cap{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin:0 0 6px}
html[lang="gu"] .cap{font-size:14px}
.triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.triple div,.rec-s div{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.k{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
html[lang="gu"] .k{font-size:13px}
.v{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.add{display:flex;gap:8px}
.btn{min-height:52px;padding:0 18px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px}
.add .btn{white-space:nowrap}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.bags{list-style:none;margin:0;padding:0;display:grid;gap:0}
.bags li{display:grid;grid-template-columns:3em minmax(0,1fr) minmax(0,1fr) 44px;align-items:center;gap:8px;padding:2px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.bags li.hd{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--line);padding-bottom:4px}
.bags .run{font-weight:700;text-align:right}
.rm{width:44px;height:44px;border:0;background:transparent;color:var(--bad);font-size:26px;line-height:1;cursor:pointer;border-radius:8px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.total .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0}
.warn{font-size:14px;color:var(--bad);margin:0;font-weight:600}
.cmp{display:grid;gap:10px}
.cmp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.cmp-l{font-weight:700;grid-column:1;grid-row:1}
.cmp-l small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.cmp-w{grid-column:1;grid-row:2;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.cmp-i{grid-column:2;grid-row:1/3;align-self:center;text-align:right;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.cmp-row.gain{background:var(--gold-bg);border-color:transparent}
.cmp-row.gain .cmp-i{color:var(--good);font-size:28px}
.cmp-row.gain .cmp-i.neg{color:var(--bad)}
details{border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--surface)}
summary{cursor:pointer;font-weight:700;font-size:14px}
details .grid2,details .full{margin-top:12px}
.foot{font-size:13px;color:var(--muted);margin:0}
.rec{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.rec-h{display:flex;justify-content:space-between;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
.rec-t{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.rec-d{color:var(--muted);font-size:13px}
.rec-s{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rec-s .v{font-size:17px}
.recs{display:grid;gap:10px}
.empty{color:var(--muted);margin:0}
.link{font-size:14px;font-weight:600;color:var(--accent);align-self:center}
textarea.csv{width:100%;min-height:140px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:10px;padding:8px}
</style>

<main class="wrap">
  <header>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="sub"></p>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tab-calc" data-i="tabCalc" aria-selected="true"></button>
    <button type="button" class="tab" role="tab" id="tab-saved" aria-selected="false"></button>
  </div>

  <div class="view" id="view-calc">
    <div class="bar">
      <button type="button" class="btn ghost sm" id="example" data-i="example"></button>
      <button type="button" class="btn ghost sm" id="clear" data-i="clear"></button>
    </div>

    <section class="card" aria-labelledby="h-loc">
      <h2 id="h-loc" data-i="plotDetails"></h2>
      <div class="grid2">
        <div><label for="mdo" data-i="mdo"></label><input id="mdo" type="text" maxlength="80" autocomplete="off"></div>
        <div><label for="cluster" data-i="cluster"></label><input id="cluster" type="text" maxlength="80" autocomplete="off"></div>
      </div>
      <div><label for="village" data-i="village"></label><input id="village" type="text" maxlength="80" data-ph="villagePh" autocomplete="off"></div>
      <div><label for="label" data-i="farmer"></label><input id="label" type="text" maxlength="80" data-ph="farmerPh" autocomplete="off"></div>
      <button type="button" class="btn" id="loc" data-i="capLoc"></button>
      <div class="grid2">
        <div><label for="lat" data-i="lat"></label><input id="lat" type="number" inputmode="decimal" step="any" placeholder="0.000000"></div>
        <div><label for="lon" data-i="lon"></label><input id="lon" type="number" inputmode="decimal" step="any" placeholder="0.000000"></div>
      </div>
      <p class="note" id="loc-msg" role="status"></p>
    </section>

    <section class="card" aria-labelledby="h-pop">
      <h2 id="h-pop" data-i="popTitle"></h2>
      <p class="hint" data-i="popHint"></p>
      <div><label for="pop" data-i="popLabel"></label><input id="pop" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div>
      <div class="hero">
        <span class="unit" data-i="popAcre"></span>
        <span class="big" id="plants-acre">—</span>
      </div>
    </section>

    <section class="card" aria-labelledby="h-cob">
      <h2 id="h-cob" data-i="cobTitle"></h2>
      <div>
        <label for="seed" data-i="seedLabel"></label>
        <select id="seed">
          <option value="" data-i="seedSelect"></option>
          <option value="Adv 9293">Adv 9293</option>
          <option value="Adv 751">Adv 751</option>
          <option value="Adv 741">Adv 741</option>
          <option value="Adv 765">Adv 765</option>
        </select>
      </div>
      <div>
        <label for="cob-in" data-i="cobAdd"></label>
        <div class="add">
          <input id="cob-in" type="number" inputmode="decimal" min="0" step="any" data-ph="kgPh">
          <button type="button" class="btn" id="cob-add" data-i="add" data-al="cobAddAria"></button>
        </div>
      </div>
      <ul class="bags" id="cob-list"></ul>
      <div class="total"><span class="lbl" style="margin:0" data-i="plotTotal"></span><span class="big" id="cob-plot">—</span></div>
      <div>
        <p class="cap" data-i="perAcre"></p>
        <div class="triple" data-id="cob-a"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="h-grain">
      <h2 id="h-grain" data-i="grainTitle"></h2>
      <div>
        <label for="grain-in" data-i="grainAdd"></label>
        <div class="add">
          <input id="grain-in" type="number" inputmode="decimal" min="0" step="any" data-ph="kgPh">
          <button type="button" class="btn" id="grain-add" data-i="add" data-al="grainAddAria"></button>
        </div>
      </div>
      <ul class="bags" id="grain-list"></ul>
      <div class="total"><span class="lbl" style="margin:0" data-i="plotTotal"></span><span class="big" id="grain-plot">—</span></div>
      <div>
        <p class="cap" data-i="perAcre"></p>
        <div class="triple" data-id="grain-a"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="h-ccob">
      <h2 id="h-ccob" data-i="ccobTitle"></h2>
      <div>
        <label for="cseed" data-i="cseedLabel"></label>
        <input id="cseed" type="text" maxlength="60" data-ph="cseedPh" autocomplete="off">
      </div>
      <div>
        <label for="ccob-in" data-i="cobAdd"></label>
        <div class="add">
          <input id="ccob-in" type="number" inputmode="decimal" min="0" step="any" data-ph="kgPh">
          <button type="button" class="btn" id="ccob-add" data-i="add" data-al="ccobAddAria"></button>
        </div>
      </div>
      <ul class="bags" id="ccob-list"></ul>
      <div class="total"><span class="lbl" style="margin:0" data-i="plotTotal"></span><span class="big" id="ccob-plot">—</span></div>
      <div>
        <p class="cap" data-i="perAcre"></p>
        <div class="triple" data-id="ccob-a"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="h-cgrain">
      <h2 id="h-cgrain" data-i="cgrainTitle"></h2>
      <div>
        <label for="cgrain-in" data-i="grainAdd"></label>
        <div class="add">
          <input id="cgrain-in" type="number" inputmode="decimal" min="0" step="any" data-ph="kgPh">
          <button type="button" class="btn" id="cgrain-add" data-i="add" data-al="cgrainAddAria"></button>
        </div>
      </div>
      <ul class="bags" id="cgrain-list"></ul>
      <div class="total"><span class="lbl" style="margin:0" data-i="plotTotal"></span><span class="big" id="cgrain-plot">—</span></div>
      <div>
        <p class="cap" data-i="perAcre"></p>
        <div class="triple" data-id="cgrain-a"></div>
      </div>
    </section>

    <section class="card" aria-labelledby="h-shell">
      <h2 id="h-shell" data-i="shellTitle"></h2>
      <p class="note" data-i="shellUnit"></p>
      <div class="hero">
        <span class="unit" data-i="shellAdv"></span>
        <span class="big" id="shelling">—</span>
      </div>
      <p class="warn" id="shell-warn" data-i="shellWarn" hidden></p>
      <div class="hero">
        <span class="unit" data-i="shellComp"></span>
        <span class="big" id="shelling-c">—</span>
      </div>
      <p class="warn" id="shell-warn-c" data-i="shellWarn" hidden></p>
    </section>

    <section class="card" aria-labelledby="h-inc">
      <h2 id="h-inc" data-i="incTitle"></h2>
      <div>
        <label for="moist" data-i="moistLabel"></label>
        <input id="moist" type="number" inputmode="decimal" min="0" max="99" step="any" placeholder="25">
      </div>
      <div>
        <p class="cap" id="adj-cap"></p>
        <div class="triple" data-id="adj"></div>
        <p class="note" id="adj-note" style="margin-top:6px"></p>
      </div>
      <div>
        <label for="price" data-i="priceLabel"></label>
        <div class="grid2">
          <input id="price" type="number" inputmode="decimal" min="0" step="any" placeholder="₹">
          <select id="unit" data-al="priceUnitAria">
            <option value="kg" data-i="kg"></option>
            <option value="qtl" data-i="qtl"></option>
            <option value="mann" data-i="mann"></option>
          </select>
        </div>
      </div>
      <p class="note" id="price-note"></p>
      <div>
        <label for="baseline" data-i="baseLabel"></label>
        <div class="grid2">
          <input id="baseline" type="number" inputmode="decimal" min="0" step="any" placeholder="5">
          <select id="baseUnit" data-al="baseUnitAria">
            <option value="kg" data-i="kg"></option>
            <option value="qtl" data-i="qtl"></option>
            <option value="mann" data-i="mann"></option>
          </select>
        </div>
      </div>

      <div class="cmp">
        <div class="cmp-row">
          <div class="cmp-l"><span data-i="withAdv"></span><small id="with-small"></small></div>
          <div class="cmp-w"><span id="with-q">—</span> <span data-i="qtlS"></span> · <span id="with-m">—</span> <span data-i="mannS"></span></div>
          <div class="cmp-i" id="with-inc">—</div>
        </div>
        <div class="cmp-row">
          <div class="cmp-l"><span data-i="withoutAdv"></span><small data-i="withoutSmall"></small></div>
          <div class="cmp-w"><span id="wo-q">—</span> <span data-i="qtlS"></span> · <span id="wo-m">—</span> <span data-i="mannS"></span></div>
          <div class="cmp-i" id="wo-inc">—</div>
        </div>
        <div class="cmp-row gain">
          <div class="cmp-l"><span data-i="gainL"></span><small data-i="gainSmall"></small></div>
          <div class="cmp-w" data-i="perAcreWord"></div>
          <div class="cmp-i" id="gain">—</div>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="h-save">
      <h2 id="h-save" data-i="saveTitle"></h2>
      <button type="button" class="btn" id="save"></button>
      <p class="note" id="save-msg" role="status"></p>
    </section>

    <details>
      <summary data-i="settings"></summary>
      <div class="full">
        <label for="lang" data-i="langLabel"></label>
        <select id="lang">
          <option value="gu">ગુજરાતી</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="full">
        <label for="method" data-i="methodLabel"></label>
        <select id="method">
          <option value="simple" data-i="mSimple"></option>
          <option value="dm" data-i="mDm"></option>
        </select>
      </div>
      <div class="full">
        <label for="std" data-i="stdLabel"></label>
        <input id="std" type="number" inputmode="decimal" min="1" max="99" step="any">
      </div>
      <p class="foot full" data-i="settingsFoot"></p>
    </details>
  </div>

  <div class="view" id="view-saved" hidden>
    <p class="note" id="store-warn" data-i="storeWarn" hidden></p>

    <section class="card" id="avg" aria-labelledby="h-avg">
      <h2 id="h-avg"></h2>
      <div class="rec-s">
        <div><span class="k" data-i="avgPlants"></span><span class="v" id="avg-p">—</span></div>
        <div><span class="k" data-i="avgGrain"></span><span class="v" id="avg-g">—</span></div>
        <div><span class="k" data-i="avgShell"></span><span class="v" id="avg-s">—</span></div>
        <div><span class="k" data-i="avgGain"></span><span class="v" id="avg-i">—</span></div>
      </div>
    </section>

    <section class="card" id="saved-tools" aria-labelledby="h-exp">
      <h2 id="h-exp" data-i="exportT"></h2>
      <div class="btnrow">
        <button type="button" class="btn sm" id="dl" data-i="dl"></button>
        <button type="button" class="btn ghost sm" id="copy" data-i="copy"></button>
        <button type="button" class="btn ghost sm" id="share" data-i="share" hidden></button>
      </div>
      <textarea class="csv" id="csv" readonly hidden data-al="csvAria"></textarea>
      <p class="note" id="exp-msg" role="status"></p>
      <p class="note" data-i="storeNote"></p>
    </section>

    <p class="empty" id="saved-empty" data-i="empty"></p>
    <div class="recs" id="rec-list"></div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var FACTOR = 40;
  var SKEY = 'dkdpkp-v2', RKEY = 'dkdpkp-records-v2';
  var DEF = { pop: '', mdo: '', cluster: '', seed: '', cseed: '', cob: [], grain: [], ccob: [], cgrain: [], moist: '', price: '', unit: 'qtl', baseline: '', baseUnit: 'qtl', std: '14', method: 'simple', label: '', village: '', lat: '', lon: '', acc: '', lang: 'gu', recId: null };
  var INPUTS = ['pop', 'moist', 'price', 'baseline', 'std', 'label', 'village', 'mdo', 'cluster', 'cseed', 'lat', 'lon'];
  var SELECTS = ['unit', 'baseUnit', 'method', 'seed'];
  var storeOk = true;
  try { localStorage.setItem('dkdpkp-t', '1'); localStorage.removeItem('dkdpkp-t'); } catch (e) { storeOk = false; }

  /* ---------- translations ---------- */
  var T = {
    gu: {
      title: 'DKDPKP ફીલ્ડ કેલ્ક્યુલેટર',
      sub: '10 × 10 મીટરના પ્લોટને ×40 કરીને એક એકર. વજન કિલોગ્રામમાં.',
      tabCalc: 'કેલ્ક્યુલેટર', tabSaved: 'સાચવેલા ({n})',
      example: 'ઉદાહરણ ભરો', clear: 'બધું સાફ કરો', clearAgain: 'સાફ કરવા ફરી દબાવો',
      plotDetails: 'ફીલ્ડ વિગત', mdo: 'MDO નું નામ', cluster: 'ક્લસ્ટર',
      village: 'ગામ', villagePh: 'દા.ત. દાહોદ',
      farmer: 'ખેડૂતનું નામ (વૈકલ્પિક)', farmerPh: 'દા.ત. રમેશ પટેલ',

    r.cobAcre = S.cob.length ? r.cobPlot * f : null;
    r.grainAcre = S.grain.length ? r.grainPlot * f : null;

    r.withoutInc = (r.baseKg != null && r.pricePerKg != null) ? r.baseKg * r.pricePerKg : null;

  }
  function cell(txt, cls) { var d = document.createElement('span'); if (cls) d.className = cls; d.textContent = txt; return d; }
  function dstr(ts) { return new Date(ts).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  function dcsv(ts) {
    var d = new Date(ts), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function renderList(key) {
    var ul = $(key + '-list');
    ul.textContent = '';
    var arr = S[key];
    if (!arr.length) return;
    var hd = document.createElement('li');
    hd.className = 'hd';
    hd.append(cell(t('bagHd1')), cell(t('bagHd2')), cell(t('bagHd3'), 'run'), cell(''));
    ul.appendChild(hd);
    var run = 0;
    arr.forEach(function (w, i) {
      run += w;
      var li = document.createElement('li');
      li.append(cell('#' + (i + 1)), cell(fmt(w, 0, 2)), cell(fmt(run, 0, 2), 'run'));
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'rm'; b.textContent = '×';
      b.setAttribute('aria-label', t('rmAria', { n: i + 1 }));
      b.addEventListener('click', function () { S[key].splice(i, 1); edit(); });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  function addWeight(key) {
    var inp = $(key + '-in');
    var w = num(inp.value);
    if (w == null || w <= 0) { inp.focus(); return; }
    S[key].push(w);
    inp.value = '';
    inp.focus();
    edit();
  }

  var locNote = '';
  function edit() { $('save-msg').textContent = ''; locNote = ''; update(); }

  function update() {
    var r = compute(S);
    renderList('cob'); renderList('grain'); renderList('ccob'); renderList('cgrain');
    var stdTxt = fmt(r.std, 0, 1);
    $('adj-cap').textContent = t('adjCap', { std: stdTxt });
    $('with-small').textContent = t('withSmall', { std: stdTxt });

    $('plants-acre').textContent = fmt(r.plantsAcre, 0, 0);

    $('cob-plot').textContent = S.cob.length ? fmt(r.cobPlot, 0, 2) + ' ' + t('kg') : '—';
    $('grain-plot').textContent = S.grain.length ? fmt(r.grainPlot, 0, 2) + ' ' + t('kg') : '—';
    setTriple('cob-a', r.cobAcre);
    setTriple('grain-a', r.grainAcre);
    $('ccob-plot').textContent = S.ccob.length ? fmt(r.ccPlot, 0, 2) + ' ' + t('kg') : '—';
    $('cgrain-plot').textContent = S.cgrain.length ? fmt(r.cgPlot, 0, 2) + ' ' + t('kg') : '—';
    setTriple('ccob-a', r.ccAcre);
    setTriple('cgrain-a', r.cgAcre);

    $('shelling').textContent = r.shelling == null ? '—' : fmt(r.shelling, 1, 1) + ' %';
    $('shell-warn').hidden = !(r.shelling != null && r.shelling > 100);
    $('shelling-c').textContent = r.cShelling == null ? '—' : fmt(r.cShelling, 1, 1) + ' %';
    $('shell-warn-c').hidden = !(r.cShelling != null && r.cShelling > 100);

    setTriple('adj', r.adjKg);
    var note = '';
    if (r.grainAcre == null) note = t('needGrain');
    else if (!r.moistOk) note = t('needMoist');
    else if (S.method === 'dm') note = t('noteDm', { m: fmt(r.m, 0, 1), s: stdTxt });
    else {
      var d = r.m - r.std;
      note = t(d >= 0 ? 'noteSub' : 'noteAdd', { d: fmt(Math.abs(d), 0, 1), m: fmt(r.m, 0, 1), s: stdTxt });
    }
    $('adj-note').textContent = note;

    $('price-note').textContent = r.pricePerKg == null ? '' : t('priceNote', { p: fmt(r.pricePerKg, 2, 2) });

    $('with-q').textContent = fmt(r.adjKg == null ? null : r.adjKg / 100, 2, 2);
    $('with-m').textContent = fmt(r.adjKg == null ? null : r.adjKg / 20, 1, 1);
    $('wo-q').textContent = fmt(r.baseKg == null ? null : r.baseKg / 100, 2, 2);
    $('wo-m').textContent = fmt(r.baseKg == null ? null : r.baseKg / 20, 1, 1);
    $('with-inc').textContent = inr(r.withInc);
    $('wo-inc').textContent = inr(r.withoutInc);
    $('gain').textContent = inr(r.gain);
    $('gain').classList.toggle('neg', r.gain != null && r.gain < 0);
    $('save').textContent = t(S.recId ? 'btnUpdate' : 'btnSave');
    $('loc-msg').textContent = locNote || (S.acc ? t('locAcc', { n: S.acc }) : '');
    if (!$('loc').disabled) $('loc').textContent = t(S.lat ? 'capLocAgain' : 'capLoc');
    save();
  }

  function sync() {
    INPUTS.forEach(function (k) { $(k).value = S[k]; });
    SELECTS.forEach(function (k) { $(k).value = S[k]; });
    $('lang').value = S.lang;
  }

  /* ---------- records ---------- */
  function saveRecord() {
    var r = compute(S);
    if (r.plantsAcre == null && !S.cob.length && !S.grain.length) { $('save-msg').textContent = t('nothing'); return; }
    var snap = clone(S); delete snap.recId; delete snap.lang;
    var now = new Date().toISOString();
    var rec = null;
    if (S.recId) R.forEach(function (x) { if (x.id === S.recId) rec = x; });
    if (rec) { rec.s = snap; rec.label = S.label.trim(); rec.updated = now; }
    else {
      rec = { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: now, label: S.label.trim(), s: snap };
      R.unshift(rec);
      S.recId = rec.id;
    }
    var ok = saveRecords();
    update();
    renderSaved();
    $('save-msg').textContent = ok ? t('savedMsg', { d: dstr(now) }) : t('saveFail');
  }

  function avg(a) { return a.length ? sum(a) / a.length : null; }
  function renderSaved() {
    $('tab-saved').textContent = t('tabSaved', { n: R.length });
    $('store-warn').hidden = storeOk;
    $('saved-empty').hidden = R.length > 0;
    $('saved-tools').hidden = R.length === 0;
    $('avg').hidden = R.length === 0;
    $('h-avg').textContent = t('avgTitle', { n: R.length });
    var list = $('rec-list');
    list.textContent = '';
    var P = [], G = [], SH = [], GN = [];
    R.forEach(function (x) {
      var r = compute(x.s);
      if (r.plantsAcre != null) P.push(r.plantsAcre);
      if (r.grainAcre != null) G.push(r.grainAcre / 100);
      if (r.shelling != null) SH.push(r.shelling);
      if (r.gain != null) GN.push(r.gain);

      var card = document.createElement('article'); card.className = 'rec';
      var h = document.createElement('div'); h.className = 'rec-h';
      var parts = [];
      if (x.s.village && x.label) parts.push(x.label);
      if (x.s.cluster) parts.push(x.s.cluster);
      if (x.s.mdo) parts.push('MDO: ' + x.s.mdo);
      if (x.s.seed || x.s.cseed) parts.push((x.s.seed || '?') + (x.s.cseed ? ' vs ' + x.s.cseed : ''));
      parts.push(dstr(x.ts));
      h.append(cell(x.s.village || x.label || t('noVillage'), 'rec-t'), cell(parts.join(' · '), 'rec-d'));
      var s = document.createElement('div'); s.className = 'rec-s';
      [[t('avgPlants'), fmt(r.plantsAcre, 0, 0)],
       [t('avgGrain'), fmt(r.grainAcre == null ? null : r.grainAcre / 100, 2, 2)],
       [t('avgShell'), r.shelling == null ? '—' : fmt(r.shelling, 1, 1) + ' %'],
       [t('avgGain'), inr(r.gain)]].forEach(function (p) {
        var c = document.createElement('div'); c.append(cell(p[0], 'k'), cell(p[1], 'v')); s.appendChild(c);
      });
      var a = document.createElement('div'); a.className = 'btnrow';
      var open = document.createElement('button'); open.type = 'button'; open.className = 'btn ghost sm'; open.textContent = t('open');
      open.addEventListener('click', function () {
        S = Object.assign(clone(DEF), clone(x.s), { recId: x.id, lang: S.lang });
        migrate(S);
        sync(); $('save-msg').textContent = ''; locNote = ''; update(); show('calc');
      });
      var del = document.createElement('button'); del.type = 'button'; del.className = 'btn ghost sm'; del.textContent = t('del');
      var tm = null;
      del.addEventListener('click', function () {
        if (!tm) { del.textContent = t('delAgain'); tm = setTimeout(function () { tm = null; del.textContent = t('del'); }, 3000); return; }
        clearTimeout(tm);
        R = R.filter(function (y) { return y.id !== x.id; });
        if (S.recId === x.id) S.recId = null;
        saveRecords(); update(); renderSaved();
      });
      a.append(open, del);
      var la = num(x.s.lat), lo = num(x.s.lon);
      if (la != null && lo != null) {
        var ml = document.createElement('a'); ml.className = 'link';
        ml.href = 'https://www.google.com/maps?q=' + la + ',' + lo; ml.target = '_blank'; ml.rel = 'noopener';
        ml.textContent = t('mapLink', { lat: la.toFixed(5), lon: lo.toFixed(5) });
        a.append(ml);
      }
      card.append(h, s, a);
      list.appendChild(card);
    });
    $('avg-p').textContent = fmt(avg(P), 0, 0);
    $('avg-g').textContent = fmt(avg(G), 2, 2);
    $('avg-s').textContent = SH.length ? fmt(avg(SH), 1, 1) + ' %' : '—';
    $('avg-i').textContent = inr(avg(GN));
  }

  /* ---------- CSV export (headers stay in English for Excel) ---------- */
  function rn(n, d) { if (n == null) return ''; var k = Math.pow(10, d); return Math.round(n * k) / k; }
  function esc(v, isText) {
    if (v == null) return '';
    v = String(v);
    if (isText && /^[=+\-@\t\r]/.test(v)) v = "'" + v;
    if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  var UN = { kg: 'kg', qtl: 'Quintal', mann: 'Mann' };
  var COLS = [
    ['Date', function (x) { return dcsv(x.ts); }, 1],
    ['MDO', function (x) { return x.s.mdo || ''; }, 1],
    ['Cluster', function (x) { return x.s.cluster || ''; }, 1],
    ['Village', function (x) { return x.s.village || ''; }, 1],
    ['Farmer name', function (x) { return x.label; }, 1],
    ['Latitude', function (x) { return num(x.s.lat); }],
    ['Longitude', function (x) { return num(x.s.lon); }],
    ['GPS accuracy m', function (x) { return num(x.s.acc); }],
    ['Plants in 10x10 m plot', function (x, r) { return r.plantsPlot; }],
    ['Plants per acre', function (x, r) { return r.plantsAcre; }],
    ['Advanta hybrid', function (x) { return x.s.seed || ''; }, 1],
    ['Competitor hybrid', function (x) { return x.s.cseed || ''; }, 1],
    ['Cob bags kg (plot)', function (x) { return x.s.cob.join(' + '); }, 1],
    ['Cob total kg (plot)', function (x, r) { return x.s.cob.length ? rn(r.cobPlot, 2) : ''; }],
    ['Cob kg per acre', function (x, r) { return rn(r.cobAcre, 1); }],
    ['Grain bags kg (plot)', function (x) { return x.s.grain.join(' + '); }, 1],
    ['Grain total kg (plot)', function (x, r) { return x.s.grain.length ? rn(r.grainPlot, 2) : ''; }],
    ['Grain kg per acre', function (x, r) { return rn(r.grainAcre, 1); }],
    ['Grain qtl per acre', function (x, r) { return rn(r.grainAcre == null ? null : r.grainAcre / 100, 2); }],
    ['Grain Mann per acre', function (x, r) { return rn(r.grainAcre == null ? null : r.grainAcre / 20, 1); }],
    ['Shelling %', function (x, r) { return rn(r.shelling, 1); }],
    ['Competitor cob bags kg (plot)', function (x) { return (x.s.ccob || []).join(' + '); }, 1],
    ['Competitor cob total kg (plot)', function (x, r) { return (x.s.ccob || []).length ? rn(r.ccPlot, 2) : ''; }],
    ['Competitor cob kg per acre', function (x, r) { return rn(r.ccAcre, 1); }],
    ['Competitor grain bags kg (plot)', function (x) { return (x.s.cgrain || []).join(' + '); }, 1],
    ['Competitor grain total kg (plot)', function (x, r) { return (x.s.cgrain || []).length ? rn(r.cgPlot, 2) : ''; }],
    ['Competitor grain kg per acre', function (x, r) { return rn(r.cgAcre, 1); }],
    ['Competitor grain qtl per acre', function (x, r) { return rn(r.cgAcre == null ? null : r.cgAcre / 100, 2); }],
    ['Competitor grain Mann per acre', function (x, r) { return rn(r.cgAcre == null ? null : r.cgAcre / 20, 1); }],
    ['Competitor shelling %', function (x, r) { return rn(r.cShelling, 1); }],
    ['Current moisture %', function (x) { return num(x.s.moist); }],
    ['Standard moisture %', function (x, r) { return r.std; }],
    ['Moisture method', function (x) { return x.s.method === 'dm' ? 'Accurate' : 'Simple'; }, 1],
    ['Adjusted kg per acre', function (x, r) { return rn(r.adjKg, 1); }],
    ['Adjusted qtl per acre', function (x, r) { return rn(r.adjKg == null ? null : r.adjKg / 100, 2); }],
    ['Adjusted Mann per acre', function (x, r) { return rn(r.adjKg == null ? null : r.adjKg / 20, 1); }],
    ['Price', function (x) { return num(x.s.price); }],
    ['Price per', function (x) { return UN[x.s.unit] || 'Quintal'; }, 1],
    ['Without Advanta yield per acre', function (x) { return num(x.s.baseline); }],
    ['Without Advanta yield unit', function (x) { return UN[x.s.baseUnit] || 'Quintal'; }, 1],
    ['Without Advanta qtl per acre', function (x, r) { return rn(r.baseKg == null ? null : r.baseKg / 100, 2); }],
    ['Income with Advanta', function (x, r) { return rn(r.withInc, 0); }],
    ['Income without Advanta', function (x, r) { return rn(r.withoutInc, 0); }],
    ['Income gain', function (x, r) { return rn(r.gain, 0); }]
  ];
  function buildCsv() {
    var lines = [COLS.map(function (c) { return esc(c[0], true); }).join(',')];
    R.slice().reverse().forEach(function (x) {
      var r = compute(x.s);
      lines.push(COLS.map(function (c) { return esc(c[1](x, r), !!c[2]); }).join(','));
    });
    return lines.join('\r\n');
  }
  function expMsg(m) { $('exp-msg').textContent = m; }
  function stamp() { return dcsv(new Date().toISOString()).replace(/[: ]/g, '-'); }
  function downloadCsv() {
    var csv = buildCsv();
    try {
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dkdpkp-records-' + stamp() + '.csv';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      expMsg(t('dlMsg'));
    } catch (e) { expMsg(t('dlNo')); }
  }
  function copyCsv() {
    var csv = buildCsv(), ta = $('csv');
    function fail() { ta.hidden = false; ta.value = csv; ta.focus(); ta.select(); expMsg(t('copyBlocked')); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(csv).then(function () { expMsg(t('copied')); }, fail);
      } else fail();
    } catch (e) { fail(); }
  }
  function shareCsv() {
    try {
      var f = new File(['﻿' + buildCsv()], 'dkdpkp-records.csv', { type: 'text/csv' });
      navigator.share({ files: [f], title: 'DKDPKP records' }).catch(function () {});
    } catch (e) { expMsg(t('shareNo')); }
  }
  try {
    var probe = new File(['x'], 'a.csv', { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [probe] })) $('share').hidden = false;
  } catch (e) {}

  /* ---------- location ---------- */
  function getLoc() {
    var b = $('loc');
    if (!navigator.geolocation) { locNote = t('locNo'); $('loc-msg').textContent = locNote; return; }
    b.disabled = true; b.textContent = t('gettingLoc');
    locNote = t('locWait');
    $('loc-msg').textContent = locNote;
    navigator.geolocation.getCurrentPosition(function (p) {
      b.disabled = false;
      S.lat = p.coords.latitude.toFixed(6); S.lon = p.coords.longitude.toFixed(6); S.acc = String(Math.round(p.coords.accuracy));
      $('lat').value = S.lat; $('lon').value = S.lon;
      edit();
    }, function (err) {
      b.disabled = false;
      locNote = t(err && err.code === 1 ? 'locBlocked' : err && err.code === 3 ? 'locTimeout' : 'locFail');
      update();
      $('loc-msg').textContent = locNote;
    }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
  }

  /* ---------- tabs ---------- */
  function show(v) {
    $('view-calc').hidden = v !== 'calc';
    $('view-saved').hidden = v !== 'saved';
    $('tab-calc').setAttribute('aria-selected', v === 'calc');
    $('tab-saved').setAttribute('aria-selected', v === 'saved');
    if (v === 'saved') renderSaved();
    window.scrollTo(0, 0);
  }
  $('tab-calc').addEventListener('click', function () { show('calc'); });
  $('tab-saved').addEventListener('click', function () { show('saved'); });

  /* ---------- wiring ---------- */
  document.querySelectorAll('.triple').forEach(function (h) {
    var id = h.getAttribute('data-id');
    h.innerHTML = '<div><span class="k" data-i="kg"></span><span class="v" id="' + id + '-kg">—</span></div>' +
      '<div><span class="k" data-i="qtl"></span><span class="v" id="' + id + '-q">—</span></div>' +
      '<div><span class="k" data-i="mann"></span><span class="v" id="' + id + '-m">—</span></div>';
  });
  INPUTS.forEach(function (k) { $(k).addEventListener('input', function () { S[k] = this.value; if (k === 'lat' || k === 'lon') S.acc = ''; edit(); }); });
  SELECTS.forEach(function (k) { $(k).addEventListener('change', function () { S[k] = this.value; edit(); }); });
  $('lang').addEventListener('change', function () {
    S.lang = this.value === 'en' ? 'en' : 'gu';
    applyLang(); edit(); renderSaved();
  });
  ['cob', 'grain', 'ccob', 'cgrain'].forEach(function (k) {
    $(k + '-add').addEventListener('click', function () { addWeight(k); });
    $(k + '-in').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addWeight(k); } });
  });
  $('save').addEventListener('click', saveRecord);
  $('loc').addEventListener('click', getLoc);
  $('dl').addEventListener('click', downloadCsv);
  $('copy').addEventListener('click', copyCsv);
  $('share').addEventListener('click', shareCsv);

  $('example').addEventListener('click', function () {
    S.pop = '750'; S.cob = [16, 15.25]; S.grain = [12.5, 12.5]; S.ccob = [15, 14.25]; S.cgrain = [11, 11]; S.seed = 'Adv 9293'; S.cseed = t('exComp');
    S.moist = '25'; S.price = '2400'; S.unit = 'qtl'; S.baseline = '5'; S.baseUnit = 'qtl';
    S.label = t('exFarmer'); S.village = t('exVillage'); S.mdo = S.mdo || t('exMdo'); S.cluster = S.cluster || t('exCluster'); S.recId = null;
    sync(); edit();
  });

  var clr = $('clear'), timer = null;
  clr.addEventListener('click', function () {
    if (!timer) {
      clr.textContent = t('clearAgain');
      timer = setTimeout(function () { timer = null; clr.textContent = t('clear'); }, 3000);
      return;
    }
    clearTimeout(timer); timer = null; clr.textContent = t('clear');
    var keep = { std: S.std, method: S.method, mdo: S.mdo, cluster: S.cluster, village: S.village, lang: S.lang };
    S = Object.assign(clone(DEF), keep);
    sync(); edit();
  });

  applyLang();
  sync();
  update();
  renderSaved();
})();
</script>

<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} });
}
</script>
</html>
